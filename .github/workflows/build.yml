
name: Telegram iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Environment
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      # 1. Download source code
      - name: Checkout Telegram
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      # 2. Fix tgcalls submodule URL
      - name: Fix submodule URLs
        shell: bash
        run: |
          set -euo pipefail

          git config -f .gitmodules \
            submodule.submodules/TgVoipWebrtc/tgcalls.url \
            https://github.com/TelegramMessenger/tgcalls.git

          git submodule sync --recursive

          echo "Submodule URLs configured"

      # 3. Download submodules
      - name: Initialize submodules
        shell: bash
        run: |
          set -euo pipefail

          git -c protocol.file.allow=never \
            submodule update --init --recursive --jobs 4

          git submodule status

          echo "Submodules downloaded"

      # 4. Check macOS and Xcode
      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== macOS ==="
          sw_vers

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Python ==="
          python3 --version

          echo "=== Required versions ==="
          cat versions.json

          echo "=== Git Commit ==="
          git rev-parse HEAD

      # 5. Check project files
      - name: Verify Telegram project
        shell: bash
        run: |
          set -euo pipefail

          test -f Telegram/BUILD
          test -f build-system/Make/Make.py
          test -f versions.json

          test -d submodules/TgVoipWebrtc/tgcalls

          echo "Telegram source structure OK"

      # 6. Check available resources
      - name: Check resources
        shell: bash
        run: |
          echo "=== Disk ==="
          df -h .

          echo "=== Memory ==="
          sysctl -n hw.memsize

          echo "=== CPU ==="
          sysctl -n hw.ncpu

      # 7. Save diagnostic report
      - name: Create build report
        if: always()
        shell: bash
        run: |
          {
            echo "Telegram iOS diagnostics"
            echo "========================"
            echo ""
            echo "Commit:"
            git rev-parse HEAD
            echo ""
            echo "macOS:"
            sw_vers
            echo ""
            echo "Xcode:"
            xcodebuild -version
            echo ""
            echo "Required versions:"
            cat versions.json
            echo ""
            echo "Submodules:"
            git submodule status
          } > build-report.txt

      # 8. Upload diagnostics
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-build-report
          path: build-report.txt
          retention-days: 7
