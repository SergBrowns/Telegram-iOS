
name: Compile Telegram iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile MessageWidget
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      # 1. Checkout
      - name: Checkout Telegram
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      # 2. Fix submodules
      - name: Initialize submodules
        shell: bash
        run: |
          set -euo pipefail

          git config -f .gitmodules \
            submodule.submodules/TgVoipWebrtc/tgcalls.url \
            https://github.com/TelegramMessenger/tgcalls.git

          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4

      # 3. Verify environment
      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail

          sw_vers
          xcodebuild -version
          python3 --version
          cat versions.json
          df -h .

      # 4. Create private configuration
      - name: Prepare configuration
        shell: bash
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import hashlib
          from pathlib import Path

          api_id = os.environ.get("API_ID", "")
          api_hash = os.environ.get("API_HASH", "")

          if not api_id.isdigit() or not api_hash:
              raise SystemExit("Invalid API credentials")

          template = Path(
              "build-system/"
              "template_minimal_development_configuration.json"
          )

          config = json.loads(
              template.read_text(encoding="utf-8")
          )

          unique_id = hashlib.sha256(
              os.environ["GITHUB_REPOSITORY"].encode()
          ).hexdigest()[:12]

          config["bundle_id"] = (
              f"org.personalstudy.{unique_id}"
          )

          config["api_id"] = api_id
          config["api_hash"] = api_hash
          config["team_id"] = "0000000000"

          config["is_internal_build"] = "true"
          config["is_appstore_build"] = "false"
          config["appstore_id"] = "0"

          config["enable_siri"] = False
          config["enable_icloud"] = False

          destination = (
              Path(os.environ["RUNNER_TEMP"])
              / "telegram-build.json"
          )

          destination.write_text(
              json.dumps(config, indent=2),
              encoding="utf-8"
          )
          destination.chmod(0o600)

          with open(
              os.environ["GITHUB_ENV"], "a"
          ) as output:
              output.write(
                  f"BUILD_CONFIG={destination}\n"
              )

          print("Build configuration prepared")
          PY

      # 5. Verify Swift fix
      - name: Verify MessageWidget patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="submodules/TelegramUI/Components/MessageWidget/MessageWidget/Sources/MessageWidgetInstance.swift"

          if grep -Fq "scale: CGFloat = UIScreen.main.scale" "$FILE"; then
            echo "::error::UIScreen.main.scale is not patched"
            exit 1
          fi

          echo "Previous Swift issue is patched"

      # 6. Initialize Bazel
      - name: Initialize Bazel
        shell: bash
        run: |
          set -euo pipefail

          python3 build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/bazel-cache" \
            build \
            --configurationPath="$BUILD_CONFIG" \
            --xcodeManagedCodesigning \
            --target=//Telegram:empty \
            --buildNumber=100001 \
            --configuration=debug_arm64

      # 7. Compile problematic module for iOS
      - name: Compile MessageWidget for iOS
        shell: bash
        run: |
          set -euo pipefail

          BAZEL="build-input/bazel-9.2.0-darwin-arm64"

          test -x "$BAZEL"

          "$BAZEL" build \
            //submodules/TelegramUI/Components/MessageWidget/MessageWidget:MessageWidget \
            --platforms=@build_bazel_apple_support//platforms:ios_arm64 \
            --apple_platform_type=ios \
            --ios_multi_cpus=arm64 \
            --compilation_mode=dbg \
            --jobs=2 \
            --verbose_failures

          echo "MessageWidget compiled successfully"

      # 8. Diagnostics
      - name: Create report
        if: always()
        shell: bash
        run: |
          {
            echo "Personal Telegram Compile Report"
            echo "================================"
            echo ""
            git rev-parse HEAD
            echo ""
            xcodebuild -version
            echo ""
            df -h .
          } > compile-report.txt

      # 9. Upload diagnostics
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-compile-report
          path: compile-report.txt
          retention-days: 7
