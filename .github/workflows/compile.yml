
name: Compile Telegram iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile Telegram Modules
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      # 1. Checkout repository
      - name: Checkout Telegram source
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      # 2. Fix tgcalls submodule URL
      - name: Fix submodule URLs
        shell: bash
        run: |
          set -euo pipefail

          git config -f .gitmodules \
            submodule.submodules/TgVoipWebrtc/tgcalls.url \
            https://github.com/TelegramMessenger/tgcalls.git

          git submodule sync
          git submodule update --init --recursive --jobs 4

          echo "Submodules initialized"

      # 3. Check environment
      - name: Check macOS and Xcode
        shell: bash
        run: |
          set -euo pipefail

          sw_vers
          xcodebuild -version
          python3 --version
          cat versions.json
          df -h .

      # 4. Generate private configuration
      - name: Prepare build configuration
        shell: bash
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import hashlib
          from pathlib import Path

          api_id = os.environ.get("API_ID", "")
          api_hash = os.environ.get("API_HASH", "")

          if not api_id.isdigit() or not api_hash:
              raise SystemExit(
                  "Missing Telegram API credentials"
              )

          template = Path(
              "build-system/"
              "template_minimal_development_configuration.json"
          )

          config = json.loads(
              template.read_text(encoding="utf-8")
          )

          repository = os.environ["GITHUB_REPOSITORY"]

          unique_id = hashlib.sha256(
              repository.encode()
          ).hexdigest()[:12]

          config["bundle_id"] = (
              f"org.personalstudy.{unique_id}"
          )

          config["api_id"] = api_id
          config["api_hash"] = api_hash

          # Temporary value for compile-only build.
          config["team_id"] = "0000000000"

          config["is_internal_build"] = "true"
          config["is_appstore_build"] = "false"
          config["appstore_id"] = "0"
          config["enable_siri"] = False
          config["enable_icloud"] = False

          destination = (
              Path(os.environ["RUNNER_TEMP"])
              / "telegram-build.json"
          )

          destination.write_text(
              json.dumps(config, indent=2),
              encoding="utf-8"
          )

          destination.chmod(0o600)

          with open(
              os.environ["GITHUB_ENV"], "a"
          ) as env_file:
              env_file.write(
                  f"BUILD_CONFIG={destination}\n"
              )

          print("Private configuration ready")
          print("API credentials are not printed")
          PY

      # 5. Compile Telegram modules
      - name: Compile Telegram Swift modules
        shell: bash
        run: |
          set -euo pipefail

          python3 build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/bazel-cache" \
            build \
            --configurationPath="$BUILD_CONFIG" \
            --xcodeManagedCodesigning \
            --target=//Telegram:Lib \
            --buildNumber=100001 \
            --configuration=debug_arm64

          echo "Telegram module compilation completed"

      # 6. Final report
      - name: Create compilation report
        if: always()
        shell: bash
        run: |
          {
            echo "Personal Telegram - Compile Report"
            echo "=================================="
            echo ""
            echo "Commit:"
            git rev-parse HEAD
            echo ""
            echo "Xcode:"
            xcodebuild -version
            echo ""
            echo "Bazel version requirement:"
            cat versions.json
            echo ""
            echo "Disk:"
            df -h .
          } > compile-report.txt

      # 7. Upload report
      - name: Upload compilation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-compile-report
          path: compile-report.txt
          retention-days: 7
